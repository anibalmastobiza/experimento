<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to Study</title>
    <meta http-equiv="refresh" content="0; url=./prolific_github_sheets/index.html" />
    <script>
      (function () {
        var target = new URL("./prolific_github_sheets/index.html", window.location.href);
        target.search = window.location.search;
        target.hash = window.location.hash;
        window.location.replace(target.toString());
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to study...</p>
    <p>
      If you are not redirected, open
      <a href="./prolific_github_sheets/index.html">the study page</a>.
    </p>
  </body>
</html>
